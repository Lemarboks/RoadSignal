# Local showcase services. Internal demo telemetry never changes road-risk scores.
# See docs/monitoring-setup.md; initialize before starting the bridge.
services:
  api:
    environment:
      MONITORING_TOKEN_FILE: /run/roadsignal/monitoring-token
      VERIFICATION_BASE_URL: http://verification:8080
      VISION_BASE_URL: http://vision:8080
      ROUTE_PROVIDER: ${MONITORING_ROUTE_PROVIDER:-valhalla}
    volumes:
      - integration_secrets:/run/roadsignal:ro
      - ./infrastructure/monitoring:/integration:ro

  monitoring-init:
    image: python:3.13-slim
    profiles: [monitoring]
    command: ["python", "/integration/bootstrap.py", "init"]
    volumes:
      - integration_secrets:/run/roadsignal
      - ./infrastructure/monitoring:/integration:ro
      - n8n_import:/n8n-import
    restart: "no"

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.38.7
    profiles: [monitoring]
    environment:
      GENERIC_TIMEZONE: Africa/Johannesburg
      TZ: Africa/Johannesburg
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678
      N8N_WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false" # localhost HTTP only; enable TLS before remote use
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_RUNNERS_TASK_TIMEOUT: 60
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: 268435456
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: 1000
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 1000
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      N8N_LOG_LEVEL: warn
    ports: ["127.0.0.1:5678:5678"]
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_import:/import:ro
      - ./infrastructure/monitoring/workflows:/workflows:ro
      - ./infrastructure/monitoring/import-n8n.sh:/import-workflows.sh:ro
    mem_limit: 768m
    cpus: 1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 1m
    restart: unless-stopped

  traccar:
    image: traccar/traccar:6.15.3-alpine
    profiles: [monitoring]
    environment:
      JAVA_OPTS: -Xms128m -Xmx384m
    ports: ["127.0.0.1:8082:8082"]
    volumes:
      - traccar_data:/opt/traccar/data
      - traccar_logs:/opt/traccar/logs
      - ./infrastructure/monitoring/traccar.xml:/opt/traccar/conf/traccar.xml:ro
    mem_limit: 640m
    cpus: 1
    restart: unless-stopped

  thingsboard-db:
    image: postgres:18-alpine
    profiles: [sensors]
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_PASSWORD_FILE: /run/roadsignal/thingsboard-db-password
    volumes:
      - thingsboard_data:/var/lib/postgresql
      - integration_secrets:/run/roadsignal:ro
    depends_on:
      monitoring-init: { condition: service_completed_successfully }
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thingsboard"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  thingsboard:
    image: thingsboard/tb-node:4.3.1.4
    profiles: [sensors]
    environment:
      TB_SERVICE_ID: roadsignal-demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://thingsboard-db:5432/thingsboard
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/run/roadsignal/thingsboard.properties
      TB_QUEUE_TYPE: in-memory
      JAVA_OPTS: -Xms256m -Xmx1536m
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["integration_secrets:/run/roadsignal:ro"]
    depends_on:
      thingsboard-db: { condition: service_healthy }
    mem_limit: 2500m
    cpus: 2
    logging:
      options: { max-size: "10m", max-file: "3" }
    restart: unless-stopped

  monitoring-bridge:
    image: python:3.13-slim
    profiles: [monitoring]
    command: ["python", "-u", "/integration/bridge.py"]
    environment:
      API_URL: http://api:8000
      TRACCAR_URL: http://traccar:8082
      THINGSBOARD_URL: http://thingsboard:8080
      N8N_URL: http://n8n:5678
    volumes:
      - integration_secrets:/run/roadsignal:ro
      - ./infrastructure/monitoring:/integration:ro
    depends_on:
      monitoring-init: { condition: service_completed_successfully }
      api: { condition: service_healthy }
    mem_limit: 128m
    restart: unless-stopped

  verification:
    image: roadsignal-verification:local
    build: { context: ./infrastructure/verification }
    profiles: [verification]
    environment:
      MODEL_ROLE: verification
    volumes: ["verification_models:/models"]
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready')"]
      interval: 30s
      timeout: 5s
      retries: 30
      start_period: 5m
    restart: unless-stopped

  vision:
    image: roadsignal-verification:local
    build: { context: ./infrastructure/verification }
    profiles: [vision]
    environment:
      MODEL_ROLE: vision
    volumes: ["vision_models:/models"]
    mem_limit: 1500m
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready')"]
      interval: 30s
      timeout: 5s
      retries: 30
      start_period: 5m
    restart: unless-stopped

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.8.3
    profiles: [routing]
    environment:
      tile_urls: https://download.openstreetmap.fr/extracts/africa/south_africa/western_cape-latest.osm.pbf
      server_threads: "2"
      build_admins: "True"
      build_time_zones: "True"
      build_elevation: "False"
      build_transit: "False"
      use_tiles_ignore_pbf: "True"
    volumes: ["valhalla_tiles:/custom_files"]
    mem_limit: 3g
    cpus: 2
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/status"]
      interval: 30s
      timeout: 5s
      retries: 30
      start_period: 10m
    restart: unless-stopped

  risk-training:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.training
    profiles: [training]
    volumes: ["./training-data:/data:ro", "risk_candidates:/candidates"]
    mem_limit: 2g
    cpus: 2
    restart: "no"

volumes:
  integration_secrets: {}
  n8n_import: {}
  n8n_data: {}
  traccar_data: {}
  traccar_logs: {}
  thingsboard_data: {}
  verification_models: {}
  vision_models: {}
  valhalla_tiles: {}
  risk_candidates: {}
