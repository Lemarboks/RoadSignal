services:
  - type: web
    name: roadsignal-ai-api
    env: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: STORAGE_BACKEND
        value: memory
      - key: EVENT_BACKEND
        value: memory
      - key: ROUTE_PROVIDER
        value: open
      - key: ENVIRONMENT
        value: development
      - key: REQUIRE_AUTH
        value: "true"
      - key: CORS_ORIGINS
        # Deployed origin only. CORS runs with allow_credentials, so a
        # localhost origin here would let a page on a victim's machine make
        # credentialed calls against this API using their refresh cookie.
        value: https://lemarboks.github.io
      - key: JWT_SECRET
        generateValue: true
      - key: METRICS_BEARER_TOKEN
        generateValue: true
