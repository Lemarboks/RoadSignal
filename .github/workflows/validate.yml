name: Validate application

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @saferoute/web typecheck
      - run: pnpm --filter @saferoute/web test
      - run: pnpm --filter @saferoute/web build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r apps/api/requirements.txt
      - run: python -m pytest apps/api/tests
      - run: python scripts/evaluate-risk-data.py --check
  postgis-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: saferoute
          POSTGRES_USER: saferoute
          POSTGRES_PASSWORD: saferoute
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saferoute"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      STORAGE_BACKEND: postgres
      DATABASE_URL: postgresql+psycopg://saferoute:saferoute@localhost:5432/saferoute
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: apps/api
      - run: python -m alembic -c alembic.ini upgrade head
        working-directory: apps/api
      - run: python -m pytest tests/integration -q
        working-directory: apps/api
  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      EVENT_BACKEND: redis
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: apps/api
      - run: python -m pytest tests/integration/test_redis_events.py -q
        working-directory: apps/api

  deployment-smoke:
    runs-on: ubuntu-latest
    env:
      DOMAIN: localhost
      PUBLIC_ORIGIN: https://localhost
      ACME_EMAIL: ci@example.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: infrastructure/scripts/generate-secrets.sh
      - run: docker compose -f compose.production.yml config --quiet
      - run: docker compose -f compose.production.yml up -d --build --wait
      - run: curl --fail --silent --show-error --insecure https://localhost/api/v1/health
      - run: curl --fail --silent --show-error --insecure https://localhost/ | grep -q "SafeRoute"
      - run: infrastructure/scripts/backup-postgres.sh
      - run: |
          backup=$(find backups/postgres -name 'saferoute-*.dump' | sort | head -n 1)
          CONFIRM_RESTORE=saferoute infrastructure/scripts/restore-postgres.sh "$backup"
      - run: curl --fail --silent --show-error --insecure https://localhost/api/v1/ready
      - if: failure()
        run: |
          docker compose -f compose.production.yml ps --all
          docker compose -f compose.production.yml logs --no-color --tail=200
      - if: always()
        run: docker compose -f compose.production.yml down --volumes --remove-orphans
  browser-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @saferoute/web exec playwright install --with-deps chromium
      - name: Start browser-test server
        working-directory: apps/web
        run: |
          node node_modules/next/dist/bin/next dev --hostname 127.0.0.1 > /tmp/saferoute-web.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/saferoute-web.log
          exit 1
      - run: pnpm --filter @saferoute/web test:e2e
        env:
          PLAYWRIGHT_EXTERNAL_SERVER: "1"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
  security-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.13.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pnpm install --frozen-lockfile
      # pnpm audit reports every workspace importer. This verifier evaluates
      # advisory paths and fails only for the deployed web production graph.
      - run: node scripts/audit-production.mjs
      - run: pip install pip-audit==2.9.0
      - run: pip-audit --strict --requirement apps/api/requirements.txt
      - run: >-
          docker run --rm
          -v "$PWD:/src:ro"
          aquasec/trivy:0.66.0
          fs --exit-code 1 --severity HIGH,CRITICAL
          --scanners secret,misconfig /src