name: Validate application

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @saferoute/web typecheck
      - run: pnpm --filter @saferoute/web test
      - run: pnpm --filter @saferoute/web build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r apps/api/requirements.txt
      - run: python -m pytest apps/api/tests
  postgis-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: saferoute
          POSTGRES_USER: saferoute
          POSTGRES_PASSWORD: saferoute
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saferoute"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      STORAGE_BACKEND: postgres
      DATABASE_URL: postgresql+psycopg://saferoute:saferoute@localhost:5432/saferoute
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: apps/api
      - run: python -m alembic -c alembic.ini upgrade head
        working-directory: apps/api
      - run: python -m pytest tests/integration -q
        working-directory: apps/api
