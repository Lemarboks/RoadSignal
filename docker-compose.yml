services:
  db:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: roadsignal
      MYSQL_USER: roadsignal
      MYSQL_PASSWORD: roadsignal
      MYSQL_ROOT_PASSWORD: local-root-only
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u roadsignal -proadsignal --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
  api:
    build: { context: ./apps/api }
    env_file: .env
    environment:
      STORAGE_BACKEND: mysql
      DATABASE_URL: mysql+pymysql://roadsignal:roadsignal@db:3306/roadsignal?charset=utf8mb4
      EVENT_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"], interval: 10s, timeout: 5s, retries: 10 }
volumes: { mysql_data: {} }
